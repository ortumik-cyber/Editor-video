name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/rea-setup-config-z7gmoz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar que la lista de caché está al día y pasan las pruebas unitarias
        run: npm test
      - name: Reunir solo lo que sirve la web
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js precache.json src assets vendor icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
